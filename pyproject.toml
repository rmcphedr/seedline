[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.7,<1"]
discovery = ["openai>=2.0,<3"]

[tool.setuptools.packages.find]
include = ["apps*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"] # FastAPI dependency injection uses Depends in defaults.
